name: Refresh Bun lockfile

on:
  push:
    branches:
      - main
    paths:
      - package.json
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Regenerate and verify lockfile
        run: |
          bun install --lockfile-only --registry https://registry.npmjs.org
          node -e "const s=require('fs').readFileSync('bun.lock','utf8'); if (s.includes('@tanstack/react-start@1.168.32') || s.includes('@tanstack/start-server-core@1.169.17')) process.exit(1); if (!s.includes('@tanstack/react-start@1.168.60') || !s.includes('@tanstack/start-server-core@1.169.39')) process.exit(1);"
          sed -i 's#https://europe-west1-npm.pkg.dev/lovable-core-prod/sandbox-npm-cache/#https://registry.npmjs.org/#g' bun.lock

      - name: Commit updated lockfile
        run: |
          if git diff --quiet -- bun.lock; then
            echo "bun.lock is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock
          git commit -m "fix: regenerate Bun lockfile with patched TanStack Start"
          git push origin main
